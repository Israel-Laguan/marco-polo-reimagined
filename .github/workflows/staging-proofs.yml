name: Staging proofs

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: book-staging-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ github.event_name == 'push' && 'Integrated staging proof' || 'Manuscript checks and proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/book-proof
