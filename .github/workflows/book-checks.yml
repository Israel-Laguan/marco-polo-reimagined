name: Book checks and proofs

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: book-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Manuscript checks and proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: candidate
        name: Identify the edition and proof source
        run: python3 tools/ci/github_release.py prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build and check the three volumes
        run: tools/ci/run.sh proof
        env:
          SOURCE_DATE_EPOCH: ${{ steps.candidate.outputs.epoch }}
      - name: Summarize checks
        run: python3 tools/ci/github_release.py summarize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-proof-${{ github.run_attempt }}
          path: |
            build/proof.json
            build/*.pdf
            build/*.txt
            build/*.grammar.json
            build/*.chktex.log
            build/*.pandoc.log
            build/vol*.log
            build/manuscript-lint.log
            build/tests.log
          if-no-files-found: error
          retention-days: 90

  signoff:
    name: Book release sign-off
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: book-signoff
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: book-proof-${{ github.run_attempt }}
          path: build
      - name: Verify the owner's checklist and approval
        run: python3 tools/ci/github_release.py signoff
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-approved-proof-${{ github.run_attempt }}
          path: build/approved.json
          if-no-files-found: error
          retention-days: 90
