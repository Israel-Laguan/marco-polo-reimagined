name: Build a book proof
description: Check and build the three-volume book proof and upload its reports
runs:
  using: composite
  steps:
    - id: candidate
      name: Identify the edition and proof source
      shell: bash
      run: python3 tools/ci/github_release.py prepare
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build and check the three volumes
      shell: bash
      run: tools/ci/run.sh proof
      env:
        SOURCE_DATE_EPOCH: ${{ steps.candidate.outputs.epoch }}
    - name: Summarize checks
      shell: bash
      run: python3 tools/ci/github_release.py summarize
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: book-proof-${{ github.run_attempt }}
        path: |
          build/proof.json
          build/*.pdf
          build/*.txt
          build/*.grammar.json
          build/*.chktex.log
          build/*.pandoc.log
          build/vol*.log
          build/manuscript-lint.log
          build/tests.log
        if-no-files-found: error
        retention-days: 90
