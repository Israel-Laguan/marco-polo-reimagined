review:
  idiom: good — band on buff paper, ribbon cloud and dust bands, low ground line, tuft plants; cleaner and flatter than the real JT
  period: pass — lamellar coats, fur-trimmed hats, bows and quivers, Mongol faces; Franks in soft caps, tunics and hooded cloaks; no turbans
  script: none (the round-1 stray mark is gone)
  artifact_risk: low-medium — the even modern line gives it away
  figures: Marco beardless, dark-haired, with purse, glancing back (head only, not the full twist asked for); Niccolò heavy-set and greying; Maffeo lean with a long dark beard. Niccolò's horse is hidden behind Marco's (only its grey legs show); acceptable stacking for the idiom
  scene: pursuit reads; the raiders themselves still trot rather than charge
  print: faces ~25 px at final size; legible as figures, no smearing
