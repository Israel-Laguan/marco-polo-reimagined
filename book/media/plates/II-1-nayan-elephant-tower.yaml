review:
  script: Pass. Both standards, silk corners, harness and the platform carry no lettering or seal. The tiny ringed
    cross is an emblem.
  period: Pass with source limits. The 1287 figures follow the separate cards, the hunt painting supplies period
    coat and tack detail, and the elephant platform is reconstructed.
  scene: Pass. Cublay sits on a boarded platform carried by four elephants. A white tug and two mounted escorts
    mark his party. Nayan and two attendants wait across the plain. Six people total.
  sacred_figures: Pass. Nayan’s historical association is denoted by one cross on his pennon. There are no sacred
    figures.
  idiom: Pass. The fine horse and cloth outlines, graded silk washes and separate groups across spare ground read
    as Yuan court painting.
  ground: Pass. Even pale warm silk with fine weave and no mounting seam.
  artifact_risk: Moderate. The old silk idiom is plausible enough to warrant the required modern illustration label.
  print: Pass. Native 1774×887 composition fills the 2:1 crop. Master 2700×1350 at 300 ppi. Faces, fingers, banners
    and tack checked at full scale.
  sidecar: Pass. GPT route, prompt, selected turn, negative, inputs, figure cues, exact post command and review
    are recorded.
  must_get_right:
    kublai_about_72_and_heavy: Pass. Kublai is heavyset with a head comparable to nearby riders, though elderly
      facial detail is small at this scale.
    white_tug: Pass. The white horsehair hangs from a separate pole against the silk.
    modest_host: Pass. The two small groups stand in for the armies without suggesting inflated totals.
    c3: Pass. Spotted white fur with dark collar and cuffs, red patterned robe beneath, and red-topped cap.
    c5: Pass. Small stocky horses, simple period garments and rounded saddle cloths with restrained red tack accents.
    elephant_tower: Pass. Four adult elephant heads and trunks are visible below the platform.
    nayan: Pass. Seen across the field with his own narrow dark-blue pennon and gold cross. Red lamellae, bowl helmet
      and neck guard follow his card. The Polos are absent.
  perspective_revision: Kublai is scaled to the mounted escorts and four elephant heads and trunks are visible under
    the tower. The elephant harness and platform remain a reconstruction.
  detail_corrections: The foreground elephant's visible legs now connect to its body with clearer separation from
    neighbouring animals. Four elephants remain.
follow_up: The one tower must read as carried by FOUR Asian elephants. Do not hide the head of any of the four.
  Use an oblique view, with the large platform on the backs of two near elephants and two farther elephants, each
  distinct head and gently curved trunk visible as a separate silhouette left-to-right in four staggered positions.
  Leave an empty lane immediately in front of this compact elephant group, so horses do not obscure it. Cublay’s
  cheeks and broad jaw should show his advanced age, with wrinkles, greying small beard and much greater seated
  weight. Keep both standards separate, the white horsehair tug above his group and Nayan's dark blue pennon with
  the tiny gold ringed cross farther across the open field.
