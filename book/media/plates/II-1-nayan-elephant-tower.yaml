figures:
- id: kublai
  year: 1287
  cue: "[PERIOD] Cublay, c. 72 in 1287: broad round face, fair-to-ruddy skin ('white and red' — Polo), dark eyes,\
    \ thin moustache and small beard; well-built at 50, heavy by 65, corpulent and gouty after 1280.\n         Dress\
    \ (court): single-colour Mongol robe of the feast day (white at New Year) with a crossed collar, fur trim in\
    \ winter; the small rounded pale hat with a narrow brim and a knob on top; hair in looped braids behind the\
    \ ears (S-22 C1; NPM portrait).\n         Dress (hunt and war): white fur coat flecked with black tufts, dark\
    \ fur collar and cuffs, over a red robe patterned in gold; a red-topped cap; boots; quiver at the saddle; a\
    \ dark, stocky horse with a round blue saddle-cloth (S-22 C3, Liu Guandao 1280).\n         After c. 1280 carried,\
    \ not walking or riding far: elephant-borne chamber or litter (Polo's hunt, the Nayan battle).\n         A gerfalcon\
    \ in hunting scenes.\n         No crown (except in the LdM lens).\n[AVOID]  Qing dragon robe, yellow as imperial\
    \ colour, queue; crown outside the LdM lens; Chinggis-style armour at court; fur-and-leather 'barbarian' dress\
    \ (S-22 [AVOID])"
- id: nayan
  year: 1287
  cue: "[PERIOD] Nayan, ? in 1287: about 30, seen at a distance across the field.\n         Dress (the eastern plain):\
    \ Mongol prince's armour: red-lacquered lamellae, deep bowl helmet with brow band and neck guard (Takashima\
    \ 1281 Yuan finds, Matsuura Report 4: text, not an image).\n         The cross on his standard: he was a baptised\
    \ Christian (the Book).\n[AVOID]  placing any Polo on the field"
