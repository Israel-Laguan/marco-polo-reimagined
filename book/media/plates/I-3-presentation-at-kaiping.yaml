review:
  script: Pass. Inspected blank papal letters, flask, clothing, walls, eaves and corners. No script, pseudo-script,
    numbers, seals, stamps or signatures.
  period: Pass with notes. C1 robe layering, hat and Kublai’s braids are visible. C1’s donors are later
    comparanda. Precise hall and prop details are generic.
  scene: Pass. Exactly four figures match the 1275 registry scene. Niccolò gestures toward his son while
    holding the letters. Maffeo stands behind and carries the bundle. Young Marco wears his merchant’s belt-purse.
    Marco’s paiza belongs to his subsequent service.
  rule_6: Pass. The folded credentials and stoppered oil flask are undecorated secular objects in the audience
    scene.
  idiom: Pass. Fine ink contour, flat wash, restrained facial modelling and quiet axial staging read as
    Yuan court painting.
  ground_and_aging: Pass. One continuous pale silk ground with fine and even ageing.
  artifact_risk: Moderate. A silk ground and period figure drawing make the required modern illustration
    label material.
  print: Pass. Native 1448 × 1086 at 300 ppi metadata. Inspected the four faces, hands and props at 100%
    without enlargement.
  sidecar: Pass. Prompt, in-prompt negatives, model disclosure, date, sources, caption, commands and review
    are recorded.
  kaiping_c_1275: Pass. Uses the place and approximate date fixed by the plan and registry.
  timber_hall_on_platform: Pass. Substantial timber columns, a beam and eaves sit above an uninterrupted
    platform with a short staircase.
  oil_flask: Pass. One plainly visible, stoppered amber vessel sits between the khan and the visitors.
  papal_letters: Pass. Niccolò holds the clean folded credentials with visible unmarked faces.
  kublai_about_sixty: Pass. Broad, mature features and a substantial build follow the house portrait at
    about sixty.
  c1_court_dress: Pass. Knobbed brimmed caps, crossed collars and contrasting outer and under-sleeve lengths
    are visible. Kublai alone has looped braids.
