figures:
- id: kublai
  year: 1275
  cue:
  - '[PERIOD] Cublay, c. 60 in 1275: broad round face, fair-to-ruddy skin (''white and red'' — Polo), dark
    eyes, thin moustache and small beard; well-built at 50, heavy by 65, corpulent and gouty after 1280.'
  - 'Dress (court): single-colour Mongol robe of the feast day (white at New Year) with a crossed collar,
    fur trim in winter; the small rounded pale hat with a narrow brim and a knob on top; hair in looped
    braids behind the ears (S-22 C1; NPM portrait).'
  - No crown (except in the LdM lens).
  - '[AVOID]  Qing dragon robe, yellow as imperial colour, queue; crown outside the LdM lens; Chinggis-style
    armour at court; fur-and-leather ''barbarian'' dress (S-22 [AVOID])'
- id: marco
  year: 1275
  cue:
  - '[PERIOD] Marco, c. 21 in 1275: slim, dark-haired, dark-eyed; beardless at 17; short dark beard from
    about 21; trimmed beard in Venice; grey by 50, white at 69.'
  - 'Dress (Cathay and Manzi): Mongol-style robe over trousers and boots, cut as S-22 C1: crossed collar,
    short-sleeved outer robe over a long-sleeved under-robe; at court the single colour of the feast (white
    at the White Feast); the small rounded hat with a narrow brim and a knob on top (C1); his own short
    hair, not the looped braids of Mongol men; still bearded, still the purse.'
  - The youngest of the three Latins in every scene before 1291.
  - A merchant's belt-purse (scarsella) in every scene.
  - '[AVOID]  crown, coat of arms, sword-belt of a knight; a monk''s habit; a paiza before 1275; Renaissance
    dress (the 16th-c. portrait)'
- id: niccolo
  year: 1275
  cue:
  - '[PERIOD] Niccolò, ? in 1275: the elder-looking brother: broad, heavy-set, greying beard by 1271, white
    by 1295; the one who speaks, kneels first and holds the letters.'
  - 'Dress (as Marco): as Marco''s card for each period, an older man''s longer robe.'
  - The papal letters and the flask of oil from the Sepulchre lamp (1271–75).
  - '[AVOID]  any attribute of rank beyond the paiza'
- id: maffeo
  year: 1275
  cue:
  - '[PERIOD] Maffeo, ? in 1275: leaner and taller than Niccolò, a long dark beard going grey; carries the
    travelling gear.'
  - 'Dress (both journeys): as Niccolò.'
  - Stands behind or beside Niccolò, never in front of him.
  - '[AVOID]  depicting Marta or children as present on a journey without scene evidence; his marriage is
    reported by Bolognari and Simion via Burgio, children disputed'
cues:
- C1
unsourced:
- Exact audience hall elevation, plan, roof, materials and fittings at Kaiping. Timber uprights, eaves and
  steps are generic forms in the illustration.
- The precise appearance and material of the oil flask, the papal letters and the furnishings. The objects
  are generic forms and the action follows Polo’s Prologue.
- The four principal figures are isolated in the composition. The Prologue describes a larger audience,
  whose positions and gestures are undocumented.
