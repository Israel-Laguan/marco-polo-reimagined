plate: III-3
title: Five months stranded at Samara
status: accepted
tradition: Javanese and Sumatran temple relief
caption: >-
  A shore camp at Samara during the five-month monsoon wait, with palm-tappers and junks at anchor. The Franco-Italian and Venetian texts describe wooden defences; the Zelada Latin and Ramusio add ditches, five timber towers and about two thousand men. The shelters, vessels and dress shown are conjectural. Modern illustration in the manner of Javanese and Sumatran temple relief. Not a historical artifact.
