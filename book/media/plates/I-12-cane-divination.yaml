review:
  script: Pass. Each page has grey-brown wash bands and a vermilion rubric, with no letters or pseudo-script.
  period: Pass with comparative limits. Chinggis wears an unarmoured felt-and-fur coat and hat. Toghrul wears the
    accepted wrap coat and felt cap. Clerical dress and camp details are generic.
  scene: Pass. Exactly four humans. Chinggis and two clerics share the foreground rite. Across open ground, Toghrul
    sits alone at his own camp, outside the divination and separately readable at print size.
  rule_6: Pass. The clerics take part as historical types in the narrated rite. No sacred figure or decorative icon
    appears.
  idiom: Pass. The compact figures, warm contour, curved garment folds, flat pigment and shallow overlapping space
    read as early Ilkhanid manuscript painting.
  ground_and_aging: Pass. Evenly aged warm paper with a clean, plain ruled edge. No mounting seam, heavy damage
    or stains.
  artifact_risk: Moderate. The border and aged manuscript-paper look make the required modern illustration label
    material. The caption identifies the episode as book theatre.
  print: Pass. 1448 × 1086, true 4:3, embedded sRGB and 300 ppi. Faces, hands, cane halves, horse tack and corners
    were checked at native size. No upscaling or sharpening.
  sidecar: Pass. Prompt, negative, model, job convention, date, caption, refs, figure cues, exact post command and
    every review item are present.
  must_get_right_nestorian_clerics: Pass. Two clerics in plain local clothing, one reading and one presenting the
    cane halves. Their religious identity comes from the narrative and caption.
  must_get_right_split_canes: Pass. Two distinct pale longitudinal halves with visible curved cross-sections rest
    on a mat in the foreground.
  must_get_right_psalter: Pass. One open bound book held to the reader, with non-linguistic wash bands on its leaves.
  must_get_right_1203: Pass. Chinggis uses the 1203 cue. Caption distinguishes Polo’s 1200 Tenduc setting from Toghrul’s
    historical defeat in 1203 elsewhere.
  must_get_right_C5: Pass with comparative limits. Plain belted garments, hats, boots and one stocky horse with
    a rounded saddlecloth and visible red breast-strap tassels.
  must_get_right_C6: Pass with comparative limits. Low cross-legged seating, brimmed felt caps, belted robes, and
    looped hair follow the comparative court treatment without introducing a separate ceremonial court.
  perspective_revision: The distant seated man, horse and tent are rescaled together. The psalter has blank pages
    and a plain central fold.
