review:
  script: Pass. Inspected the robe ornament, opposing corners, background wall, gilt dragons, eaves and ground stakes.
    No script, pseudo-script, numbers, seals, stamps or signatures.
  period: Pass with notes. Clothing follows C1, C2 and C3 with later comparanda identified in the register. Detailed
    ritual staging and architecture are generic. Gilt dragon columns are limited to Ramusio’s account in the caption.
  scene: Pass. Six distinct figures, three distinct white mares, one visible falling stream of milk and two attendants
    packing the temporary palace. Kublai observes the rite.
  rule_6: Pass. Two living ritual officiants perform the scene’s action. The image is free of decorative sacred
    figures, halos and supernatural effects.
  idiom: Pass. Fine contours on warm silk, restrained mineral washes, shallow perspective, calm figures and profile
    horses read as a Yuan handscroll.
  ground_and_aging: Pass. Continuous pale tan silk with sparse grasses and light, even ageing.
  artifact_risk: Moderate. Period-style figure drawing and silk texture warrant the modern illustration label in
    the caption.
  print: Pass. Source is already 2:1. The 2700 × 1350 PNG has 300 ppi metadata and an sRGB ICC profile. Inspected
    faces, hands, horse heads, rigging and the frame at source resolution and on the master.
  sidecar: Pass. Prompt, in-prompt negatives, generator, date, confirmed inputs, cue lines, caption and print command
    are recorded.
  white_mares: Pass. Three stocky white mares with distinct profiles and lead ropes are visible.
  shamans_and_lamas: Pass. Kneeling steppe officiant in ochre scatters milk. A shaved maroon-robed lama participates
    holding a bowl.
  cane_palace: Pass. Rounded lightweight pavilion with split-cane roof, exposed ribs and no fixed podium. Clearly
    distinct from the distant low wall and timber hall.
  silk_guy_cords: Pass. Slim, taut red and pale diagonal stays run from the cane framework to small ground stakes.
  gilt_dragon_columns: Pass. The posts have carved gilt dragons, with the Ramusio provenance in the caption.
  court_packing: Pass. Two attendants handle fabric and grouped cane poles amid packing bundles.
  c1_mongol_court_men: Pass. Attendants wear crossed collars, layered sleeves, small brimmed knob hats and looped
    hair.
  c2_mongol_noblewoman: Pass. Anonymous adult court woman with long pearl pendants, broad robe and tall flared red
    boqta.
  c3_kublai_outdoors: Pass. The white coat is flecked with black tufts, with dark fur trim, red and gold layers
    and a red-topped cap. He sits on a portable seat for the rite.
  perspective_revision: Kublai's seated figure is smaller relative to the standing woman and the mares. The pavilion
    and ritual group remain in the original composition.
