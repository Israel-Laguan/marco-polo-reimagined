  cue:
  - '[PERIOD] Cublay, c. 65 in 1280: broad round face, fair-to-ruddy skin (''white and red'' — Polo), dark eyes,
    thin moustache and small beard; well-built at 50, heavy by 65, corpulent and gouty after 1280.'
  - 'Dress (hunt and war): white fur coat flecked with black tufts, dark fur collar and cuffs, over a red robe patterned
    in gold; a red-topped cap; boots; quiver at the saddle; a dark, stocky horse with a round blue saddle-cloth
    (S-22 C3, Liu Guandao 1280).'
  - 'After c. 1280 carried, not walking or riding far: elephant-borne chamber or litter (Polo''s hunt, the Nayan
    battle).'
