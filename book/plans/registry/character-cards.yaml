- id: kublai
  likeness: "Yuan imperial portrait album (National Palace Museum, Taipei): face and court dress. Liu Guandao, Khubilai Khan Hunting (1280): body at 65, white fur over a red robe; house sheet: characters/kublai-1280-sheet.webp (CHR.T9, accepted 2026-11-18)"
  house: "broad round face, fair-to-ruddy skin ('white and red' — Polo), dark eyes, thin moustache and small beard; well-built at 50, heavy by 65, corpulent and gouty after 1280"
  attributes:
    - "after c. 1280 carried, not walking or riding far: elephant-borne chamber or litter (Polo's hunt, the Nayan battle)"
    - "a gerfalcon in hunting scenes"
    - "no crown (except in the LdM lens)"
  dress:
    - {from: 1260, to: 1294, where: "court", dress: "single-colour Mongol robe of the feast day (white at New Year) with a crossed collar, fur trim in winter; the small rounded pale hat with a narrow brim and a knob on top; hair in looped braids behind the ears (S-22 C1; NPM portrait)"}
