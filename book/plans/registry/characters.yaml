# Character registry (S-05): the naming and date authority for the recurring people of the book.
# Visual cards, plate scenes and the Polo itinerary: character-cards.yaml. Method note: characters.md.
# Tooling: python3 tools/characters.py check | ages | chapters | report [--md]
#
# Fields
#   book_name  the form the prose uses. Polo names the person -> Yule's form of Polo's text (Cublay, Alaü, Argon);
#              Polo does not -> the standard modern English form (Chabi, Bolad). Europeans keep their modern form.
#   gloss      modern form given once, in brackets, at the first mention per chapter ("" = no gloss needed)
#   aliases    variant spellings: never bare in narrative prose (lint name_policy, warning)
#   also       other legitimate names or titles, not variants (Tedaldo becomes Gregory X in 1271)
#   born/died  year (int) or null; `dates` says how firm. Where only a bound is known, died holds the latest possible
#              year ("dead by 1300" -> 1300) and born stays null. Ages in tools/characters.py are year - born (±1)
#   book_says  what the Book or the current chapters say that the record contradicts -> chapter backlogs
#   verify     the spike that must confirm a fact before a chapter states it as settled
#   chapters   generated: python3 tools/characters.py chapters
# Out of scope: scholars, editors and witnesses cited as sources (Ramusio, Pipino, Jacopo d'Acqui, Yule, Wood):
# bibliography. Saints and legend (St Thomas, Adam, Alexander) are not characters. Prester John is a legendary row in
# gazetteer.csv (S-04), which owns that form; Polo pins the name on Unc Can and King George, who are here.

people:

