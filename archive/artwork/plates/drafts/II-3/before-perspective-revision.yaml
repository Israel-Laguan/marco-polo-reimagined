follow_up: |-
  In the base prompt, replace “on a plain low offering platform. Place them as a simple clearly readable three-by-three arrangement, exactly three parcels in each of three staggered rows.” with “on ceremonial trays.” Then append:
  Prioritize the countable ceremonial gift group. To show exactly nine gifts, use THREE small distinct low rectangular wooden trays placed next to each other across the lower foreground. Each tray holds exactly THREE separated small white knotted bundles in a single row. A visible gap between the first tray and the second and between the second and the third makes the three groups easy to count. All nine complete bundles appear in front of the seated emperor. The animals are two elephants followed by two camels. All four face in the same direction toward the court. Keep all four animal heads and feet comfortably inside the edges, with a particularly broad right margin beyond the camel at the tail of the procession. Keep the central visual details of the White Feast and the all-white adult court company.
