  while Toghrul occupies the rival camp. Polo places the confrontation at Tenduc in 1200. The historical defeat
  of Toghrul came elsewhere in 1203. Modern illustration in the manner of Ilkhanid Persian manuscript painting.
  Not a historical artifact.
