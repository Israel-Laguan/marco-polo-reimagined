unsourced:
- Exact scene, arrangement of people, and physical props for Polo’s anecdote. The Book supplies the psalm, divided
  cane and opposition of the two camps. The primary-text parallel in William of Rubruck describes twig divination
  of a different kind and does not verify this event.
- The two Church of the East clerics’ precise garments, caps, appearance, and the psalter’s exterior. Generic plain
  local clothes and an undecorated bound book serve the narrative. The vellum pages are intentionally blank.
- Exact layout and construction details of the two camps. The low felt shelters and visible lattice lines are schematic.
  The camp separation shows the story’s geography rather than identifying a site.
- Toghrul’s precise face, age, and clothing colours follow the accepted working design. C5 and C6 are later comparanda
  for broad garment and saddlery forms, not evidence for 1203 costume specifics.
